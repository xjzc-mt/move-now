<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>偏好设置 · MoveNow</title>
  <link rel="stylesheet" href="../themes/themes.css" />
  <link rel="stylesheet" href="preferences.css" />
</head>
<body>
  <main class="prefs-shell">
    <!-- Native Draggable macOS Titlebar (46px) -->
    <header class="prefs-titlebar">
      <span class="titlebar-label">偏好设置</span>
    </header>

    <div class="prefs-body">
      <!-- 1. Living Theme Showcase & Quick Preview -->
      <section class="theme-studio-card">
        <div class="studio-top">
          <div class="studio-stage-wrap">
            <div class="studio-stage" id="prefsThemeStage"></div>
          </div>
          <div class="studio-main">
            <div class="studio-head-row">
              <span class="studio-caption">陪伴主题</span>
              <button class="preview-btn" id="previewBtn">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
                  <path d="M2.6 1.8a.9.9 0 0 1 1.37-.77l6.4 4.2a.9.9 0 0 1 0 1.54l-6.4 4.2A.9.9 0 0 1 2.6 10.2V1.8z"></path>
                </svg>
                <span>15s 预览</span>
              </button>
            </div>
            <div class="studio-theme-seg" id="themeGroup" role="radiogroup" aria-label="陪伴主题">
              <button class="studio-seg-btn" data-theme-choice="geometric" role="radio">几何生灵</button>
              <button class="studio-seg-btn" data-theme-choice="sketch" role="radio">简笔日常</button>
              <button class="studio-seg-btn" data-theme-choice="nature_window" role="radio">自然视窗</button>
            </div>
          </div>
        </div>
        <div class="studio-nature-row" id="natureSubRow" hidden>
          <span class="sub-row-label">视窗质感</span>
          <div class="mini-seg" id="natureStyleGroup">
            <button class="mini-seg-btn" data-nature-style="sunlight">窗棂树影</button>
            <button class="mini-seg-btn" data-nature-style="mist">晨雾玻璃</button>
            <button class="mini-seg-btn" data-nature-style="frost">寒霜晶花</button>
            <button class="mini-seg-btn" data-nature-style="auto">自动轮换</button>
          </div>
        </div>
      </section>

      <!-- 2. Rhythm Presets (Balanced 3-Column Tiles) -->
      <section class="prefs-group">
        <h2 class="group-heading">休息节奏</h2>
        <div class="rhythm-grid" id="rhythmGroup">
          <button class="rhythm-tile" data-rhythm="golden">
            <div class="tile-top">
              <span class="radio-dot"></span>
              <span class="tile-title">黄金单节奏</span>
            </div>
            <span class="tile-meta">45m 工作 · 45s 放松</span>
          </button>
          <button class="rhythm-tile" data-rhythm="dual">
            <div class="tile-top">
              <span class="radio-dot"></span>
              <span class="tile-title">护眼双节奏</span>
            </div>
            <span class="tile-meta">20m 远眺 + 60m 起身</span>
          </button>
          <button class="rhythm-tile" data-rhythm="custom">
            <div class="tile-top">
              <span class="radio-dot"></span>
              <span class="tile-title">自定义时长</span>
            </div>
            <span class="tile-meta" id="customMetaText">按工作段落设定</span>
          </button>
        </div>

        <div class="custom-duration-bar" id="customDurationBox">
          <label class="num-field">
            <span>工作间隔</span>
            <div class="num-input-wrap">
              <input type="number" id="customWorkInput" min="1" max="180" step="1" />
              <em>分钟</em>
            </div>
          </label>
          <span class="bar-v-sep"></span>
          <label class="num-field">
            <span>休息时长</span>
            <div class="num-input-wrap">
              <input type="number" id="customBreakInput" min="10" max="600" step="5" />
              <em>秒</em>
            </div>
          </label>
        </div>
      </section>

      <!-- 3. Reminder & Skip Behavior (Unified macOS Grouped Inset Panel) -->
      <section class="prefs-group">
        <h2 class="group-heading">提醒与跳过</h2>
        <div class="inset-panel">
          <div class="panel-row">
            <div class="row-lead">
              <svg class="row-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.2" y="3.2" width="13.6" height="10.2" rx="2.2"></rect>
                <path d="M6.2 15.6h5.6"></path>
              </svg>
              <span class="row-title">提醒方式</span>
            </div>
            <div class="compact-seg" id="modeGroup">
              <button class="c-seg-btn" data-mode="fullscreen_preview" id="previewModeTitle">预告 + 全屏</button>
              <button class="c-seg-btn" data-mode="corner_card">角落陪伴</button>
              <button class="c-seg-btn" data-mode="edge_glow">边缘光影</button>
            </div>
          </div>

          <div class="panel-row panel-sub-row" id="preAlertRow">
            <span class="sub-indent-label">全屏前预告倒计时</span>
            <div class="compact-seg" id="preAlertGroup">
              <button class="c-seg-btn" data-pre-alert="10">10 秒</button>
              <button class="c-seg-btn" data-pre-alert="15">15 秒</button>
              <button class="c-seg-btn" data-pre-alert="30">30 秒</button>
            </div>
          </div>

          <div class="panel-row">
            <div class="row-lead">
              <svg class="row-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.5" y="4.5" width="13" height="9" rx="2"></rect>
                <path d="M5.8 9h6.4"></path>
              </svg>
              <span class="row-title">跳过限制</span>
            </div>
            <div class="compact-seg" id="strictnessGroup">
              <button class="c-seg-btn" data-strictness="relaxed">单按 ESC</button>
              <button class="c-seg-btn" data-strictness="standard">双击防误触</button>
              <button class="c-seg-btn" data-strictness="strict">严格锁定</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. Away Seal & General Toggles (Unified macOS Grouped Inset Panel) -->
      <section class="prefs-group">
        <h2 class="group-heading">封存与通用</h2>
        <div class="inset-panel">
          <button class="panel-toggle-row" data-toggle="autoSealOnAway" role="switch" aria-checked="true">
            <div class="row-lead">
              <svg class="row-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 11.2A5.8 5.8 0 0 1 6.8 3.5a5.8 5.8 0 1 0 7.7 7.7z"></path>
              </svg>
              <div class="row-copy">
                <span class="row-title">离座自动封存</span>
                <span class="row-desc">未回座转入封存画面，轻触即醒</span>
              </div>
            </div>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </button>

          <button class="panel-toggle-row" data-toggle="preventSleepDuringSeal" role="switch" aria-checked="false">
            <div class="row-lead">
              <svg class="row-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.8 2.2L4.2 10h4.4l-.8 5.8L13.8 8H9.4l.4-5.8z"></path>
              </svg>
              <div class="row-copy">
                <span class="row-title">封存期防锁屏与后台保活</span>
                <span class="row-desc">暂离不锁屏，超时熄屏续保后台</span>
              </div>
            </div>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </button>

          <button class="panel-toggle-row" data-toggle="handsOffToCount" role="switch" aria-checked="true">
            <div class="row-lead">
              <svg class="row-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="9" r="6.3"></circle>
                <path d="M9 5.6V9l2.4 1.6"></path>
              </svg>
              <div class="row-copy">
                <span class="row-title">松开键鼠才计时</span>
                <span class="row-desc">休息时若仍在输入则暂停倒计时</span>
              </div>
            </div>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </button>

          <div class="panel-split-duo">
            <button class="panel-toggle-half" data-toggle="soundEnabled" role="switch" aria-checked="false">
              <div class="row-lead">
                <svg class="row-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3.5 7.2h2.6l3.6-2.9v9.4L6.1 10.8H3.5z"></path>
                  <path d="M12.4 6.6a3.4 3.4 0 0 1 0 4.8"></path>
                </svg>
                <span class="row-title">休息结束提示音</span>
              </div>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </button>

            <button class="panel-toggle-half" data-toggle="launchAtLogin" role="switch" aria-checked="false">
              <div class="row-lead">
                <svg class="row-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 2.8v5.2"></path>
                  <path d="M5.2 4.8a5.6 5.6 0 1 0 7.6 0"></path>
                </svg>
                <span class="row-title">开机自动启动</span>
              </div>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <footer class="prefs-footer">
      <button class="text-danger-btn" id="quitBtn">退出 MoveNow</button>
      <span class="version-label">MoveNow v0.1.0</span>
    </footer>
  </main>

  <script src="../core/actions.js"></script>
  <script src="../core/state-machine.js"></script>
  <script src="../core/bridge.js"></script>
  <script src="../themes/geometric.js"></script>
  <script src="../themes/sketch.js"></script>
  <script src="../themes/nature-window.js"></script>
  <script src="../themes/theme-stage.js"></script>
  <script src="preferences.js"></script>
</body>
</html>
